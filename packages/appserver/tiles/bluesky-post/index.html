<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bluesky post</title>
    <style>
      /* The tile document is served by the loader's worker from the headers the
         manifest's `/` resource declares, and this manifest declares no policy,
         so the page keeps its default. What bounds the card is the frame the
         host sizes from the manifest: media is cropped to a fixed height
         budget, and text is clamped, so a post with pictures does not push the
         card past it. */
      :root {
        color-scheme: light dark;
        --fg: #16181c;
        --muted: #5b6b7c;
        --rule: #d8dee6;
        --wash: #f1f4f8;
        --accent: #1d9bf0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e7ecf1;
          --muted: #8fa0b3;
          --rule: #2a3340;
          --wash: #1a2230;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
      }
      body {
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        color: var(--fg);
      }
      main {
        height: 100%;
        padding: 14px 16px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .who {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex: 0 0 auto;
      }
      .avatar {
        width: 36px;
        height: 36px;
        flex: 0 0 auto;
        border-radius: 50%;
        object-fit: cover;
        background: var(--wash);
      }
      .avatar.small {
        width: 20px;
        height: 20px;
      }
      .name {
        font-weight: 650;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .handle,
      .when,
      .muted {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .text {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
        flex: 0 1 auto;
      }
      /* Media is bounded rather than free-flowing: the host sizes the frame
         from the manifest, so an image set has a height budget and crops. */
      .images {
        display: grid;
        gap: 3px;
        border: 1px solid var(--rule);
        border-radius: 10px;
        overflow: hidden;
        flex: 0 1 auto;
        min-height: 0;
        background: var(--wash);
      }
      .images .shot {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .images.n1 {
        grid-template-columns: 1fr;
      }
      .images.n1 .shot {
        aspect-ratio: 16 / 9;
        max-height: 210px;
      }
      .images.n2 {
        grid-template-columns: 1fr 1fr;
      }
      .images.n3 {
        grid-template-columns: 1fr 1fr 1fr;
      }
      .images.n4 {
        grid-template-columns: 1fr 1fr;
      }
      .images.n2 .shot,
      .images.n3 .shot,
      .images.n4 .shot {
        aspect-ratio: 1 / 1;
      }
      .images .alt {
        grid-column: 1 / -1;
        padding: 4px 8px;
        font-size: 12px;
        color: var(--muted);
        background: var(--wash);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .external {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--rule);
        border-radius: 10px;
        padding: 8px;
        overflow: hidden;
        flex: 0 1 auto;
        min-height: 0;
      }
      .external .thumb {
        width: 56px;
        height: 56px;
        flex: 0 0 auto;
        border-radius: 6px;
        object-fit: cover;
        background: var(--wash);
      }
      .external .body {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .external .title {
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .external .muted {
        font-size: 12px;
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .quote {
        display: flex;
        flex-direction: column;
        gap: 6px;
        border: 1px solid var(--rule);
        border-radius: 10px;
        padding: 8px 10px;
        overflow: hidden;
        flex: 0 1 auto;
        min-height: 0;
      }
      .quote .text {
        font-size: 14px;
        -webkit-line-clamp: 3;
      }
      .quote .images.n1 .shot {
        max-height: 120px;
      }
      .quote .external .thumb {
        width: 40px;
        height: 40px;
      }
      /* Video stays a placeholder: the record's alt text, no player. */
      .attached {
        border: 1px solid var(--rule);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 13px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 0 0 auto;
      }
      footer {
        margin-top: auto;
        display: flex;
        gap: 14px;
        border-top: 1px solid var(--rule);
        padding-top: 8px;
        color: var(--muted);
        font-size: 13px;
        flex: 0 0 auto;
      }
      .empty {
        color: var(--muted);
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main id="post">
      <p class="empty">Waiting for the post…</p>
    </main>
    <script type="module" src="./tile.js"></script>
  </body>
</html>
