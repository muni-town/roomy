<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bluesky post</title>
    <style>
      /* Nothing here loads off-origin: the mandated CSP admits only 'self',
         blob: and data:, so an avatar or post image referenced by URL could
         not load even if it were drawn. The card is typography. */
      :root {
        color-scheme: light dark;
        --fg: #16181c;
        --muted: #5b6b7c;
        --rule: #d8dee6;
        --accent: #1d9bf0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e7ecf1;
          --muted: #8fa0b3;
          --rule: #2a3340;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
      }
      body {
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        color: var(--fg);
      }
      main {
        height: 100%;
        padding: 14px 16px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .who {
        display: flex;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
      }
      .name {
        font-weight: 650;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .handle,
      .when,
      .muted {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .text {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
        flex: 0 1 auto;
      }
      .attached {
        border: 1px solid var(--rule);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .attached strong {
        color: var(--fg);
        font-weight: 600;
      }
      footer {
        margin-top: auto;
        display: flex;
        gap: 14px;
        border-top: 1px solid var(--rule);
        padding-top: 8px;
        color: var(--muted);
        font-size: 13px;
      }
      .empty {
        color: var(--muted);
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main id="post">
      <p class="empty">Waiting for the post…</p>
    </main>
    <script type="module" src="./tile.js"></script>
  </body>
</html>
