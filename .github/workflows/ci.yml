name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  test-sdk:
    name: Test SDK
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK (dist needed by the smoke test)
        run: pnpm turbo run build-lib
      - name: Test SDK
        run: pnpm --filter @roomy-space/sdk test:run

  test-design:
    name: Test Design
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK (design depends on its dist)
        run: pnpm turbo run build-lib
      - name: Test Design
        run: pnpm --filter @roomy/design test

  test-appserver:
    name: Test Appserver
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK (appserver imports its dist)
        run: pnpm turbo run build-lib
      - name: Generate MBT traces (quint, pinned via npx)
        run: pnpm --filter @roomy/appserver mbt:traces
      - name: Test Appserver
        run: bun test --cwd packages/appserver --isolate

  test-app-lite:
    name: Test App-lite
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK (app-lite test modules import its dist)
        run: pnpm turbo run build-lib
      - name: Test App-lite
        run: pnpm --filter app-lite test

  test-app-lite-e2e:
    name: Test App-lite E2E
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The E2E stack runs the appserver from source under Bun, and app-lite
      # against the SDK's built dist — same prerequisite as the other jobs.
      - name: Build SDK (app-lite and the appserver import its dist)
        run: pnpm turbo run build-lib
      - name: Install Playwright browser
        run: pnpm --filter app-lite exec playwright install --with-deps chromium
      - name: Typecheck E2E specs
        run: pnpm --filter app-lite check:types
      # Hermetic: a stub PDS and an in-process appserver in test mode. No
      # docker, no real PDS, no network — see packages/app-lite/e2e/launch-stack.ts.
      - name: Test App-lite E2E
        run: pnpm --filter app-lite test:e2e
      - name: Upload failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-lite-e2e-report
          path: |
            packages/app-lite/test-results/
            packages/app-lite/playwright-report/
          retention-days: 7

  test-discord-bridge:
    name: Test Discord Bridge
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK (discord-bridge imports its dist)
        run: pnpm turbo run build-lib
      - name: Test Discord Bridge
        run: bun test --cwd packages/discord-bridge

  check-appserver:
    name: Typecheck Appserver
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK (typecheck resolves its dist types)
        run: pnpm turbo run build-lib
      - name: Typecheck Appserver
        run: pnpm --filter @roomy/appserver typecheck

  check-app-lite:
    name: Check App-lite
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK (svelte-check resolves its dist types)
        run: pnpm turbo run build-lib
      - name: Check App-lite
        run: pnpm --filter app-lite check
      - name: Check OAuth scope drift (config.ts vs build-prod.sh)
        run: node packages/app-lite/scripts/check-oauth-scopes.mjs

  check-sdk:
    name: Check SDK Lexicons
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check SDK Lexicons
        run: pnpm --filter @roomy-space/sdk check:lexicons

  check-docs:
    name: Check Docs Catalogue
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check endpoint catalogue matches the appserver router
        run: pnpm --filter docs check:registry
