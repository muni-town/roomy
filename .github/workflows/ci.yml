name: CI

on:
  push:
    branches:
      - main
      - next
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  test-sdk:
    name: Test SDK
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK (dist needed by the smoke test)
        run: pnpm turbo run build-lib
      - name: Test SDK
        run: pnpm --filter @roomy-space/sdk test:run

  test-design:
    name: Test Design
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK (design depends on its dist)
        run: pnpm turbo run build-lib
      - name: Test Design
        run: pnpm --filter @roomy/design test

  check-design:
    name: Check Design
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK (svelte-check resolves its dist types)
        run: pnpm turbo run build-lib
      - name: Check Design
        run: pnpm --filter @roomy/design check

  test-appserver:
    name: Test Appserver
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK (appserver imports its dist)
        run: pnpm turbo run build-lib
      - name: Generate MBT traces (quint, pinned via npx)
        run: pnpm --filter @roomy/appserver mbt:traces
      - name: Test Appserver
        run: bun test --cwd packages/appserver --isolate

  test-app-lite:
    name: Test App-lite
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK (app-lite test modules import its dist)
        run: pnpm turbo run build-lib
      - name: Test App-lite
        run: pnpm --filter app-lite test
      - name: Unit Test App-lite (Vitest)
        run: pnpm --filter app-lite test:unit

  test-app-lite-e2e:
    name: Test App-lite E2E
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The E2E stack runs the appserver from source under Bun, and app-lite
      # against the SDK's built dist — same prerequisite as the other jobs.
      - name: Build SDK (app-lite and the appserver import its dist)
        run: pnpm turbo run build-lib
      - name: Install Playwright browser
        run: pnpm --filter app-lite exec playwright install --with-deps chromium
      - name: Typecheck E2E specs
        run: pnpm --filter app-lite check:types
      # Hermetic: a stub PDS and an in-process appserver in test mode. No
      # docker, no real PDS, no network — see packages/app-lite/e2e/launch-stack.ts.
      - name: Test App-lite E2E
        run: pnpm --filter app-lite test:e2e
      - name: Upload failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-lite-e2e-report
          path: |
            packages/app-lite/test-results/
            packages/app-lite/playwright-report/
          retention-days: 7

  test-discord-bridge:
    name: Test Discord Bridge
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK (discord-bridge imports its dist)
        run: pnpm turbo run build-lib
      - name: Test Discord Bridge
        run: bun test --cwd packages/discord-bridge

  test-cli:
    name: Test CLI
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK (cli imports its dist)
        run: pnpm turbo run build-lib
      - name: Test CLI
        run: bun test --cwd packages/cli --isolate

  check-cli:
    name: Typecheck CLI
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK (typecheck resolves its dist types)
        run: pnpm turbo run build-lib
      - name: Typecheck CLI
        run: pnpm --filter @roomy/cli typecheck

  check-appserver:
    name: Typecheck Appserver
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK (typecheck resolves its dist types)
        run: pnpm turbo run build-lib
      - name: Typecheck Appserver
        run: pnpm --filter @roomy/appserver typecheck

  check-app-lite:
    name: Check App-lite
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK (svelte-check resolves its dist types)
        run: pnpm turbo run build-lib
      - name: Check App-lite
        run: pnpm --filter app-lite check
      - name: Check OAuth scope drift (config.ts vs build-prod.sh)
        run: node --experimental-strip-types packages/app-lite/scripts/check-oauth-scopes.mjs
      # The association file is generated at build time from the Apple team id,
      # so nothing committed can go stale — but the generator itself must still
      # run, and it must refuse an absent or malformed team id instead of
      # writing an appID no app can claim. Checks both.
      - name: Check the App Site Association generator
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          # A stand-in team id: this asserts the generator runs and what shape
          # it writes, not which team the deployment belongs to — that value
          # reaches the real build through APPLE_DEVELOPMENT_TEAM.
          APPLE_DEVELOPMENT_TEAM=ABCDE12345 \
            node --experimental-strip-types packages/app-lite/scripts/gen-aasa.mjs \
              --out "$tmp" --origin https://roomy.space
          node -e '
            const { readFileSync } = require("node:fs");
            const doc = JSON.parse(readFileSync(process.argv[1], "utf-8"));
            const [detail] = doc.applinks.details;
            if (detail.appIDs[0] !== "ABCDE12345.space.roomy") {
              throw new Error(`appID is ${detail.appIDs[0]}`);
            }
            if (detail.components.length === 0) {
              throw new Error("components is empty: the file claims no URL");
            }
          ' "$tmp/.well-known/apple-app-site-association"
          if APPLE_DEVELOPMENT_TEAM= \
               node --experimental-strip-types packages/app-lite/scripts/gen-aasa.mjs \
                 --out "$tmp/unset" --origin https://roomy.space 2>/dev/null; then
            echo "::error::gen-aasa.mjs accepted an unset APPLE_DEVELOPMENT_TEAM"
            exit 1
          fi
          echo "AASA generator writes $(tr -d '\n' < "$tmp/.well-known/apple-app-site-association")"
          echo "and refuses a build with no team id."

  check-sdk:
    name: Check SDK Lexicons
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check SDK Lexicons
        run: pnpm --filter @roomy-space/sdk check:lexicons

  check-docs:
    name: Check Docs Catalogue
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check endpoint catalogue matches the appserver router
        run: pnpm --filter docs check:registry

  # The Rust workspace is the Matrix bridge. Turbo stays JS-only: it has no
  # notion of cargo, and a Rust job that ran inside it would rebuild the whole
  # JS tree for every Rust change.
  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install --profile minimal --component rustfmt,clippy
          rustup show
      - name: Cache the cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: The Tauri shell is not part of this workspace
        run: |
          # `packages/app-lite/src-tauri` has its own lockfile and its own
          # toolchain needs. If the workspace ever pulled it in, this build would
          # start compiling Tauri and fail on the missing system libraries.
          if cargo metadata --no-deps --format-version 1 \
            | jq -e '.packages[].manifest_path | select(contains("src-tauri"))' >/dev/null; then
            echo "::error::the workspace includes packages/app-lite/src-tauri"
            exit 1
          fi

  # The end-to-end stack: a real homeserver, a real appserver, and the bridge in
  # a container. It runs the compose profiles the Dockerfile ships, so a broken
  # image or a wrong registration is caught here rather than at deploy time.
  test-matrix-bridge-e2e:
    name: Test Matrix bridge E2E
    runs-on: ubuntu-latest
    needs: test-rust
    # The stack has waits of a few minutes by design (image build, homeserver
    # first boot). This ceiling is what turns "something stopped answering"
    # into a failure rather than a job that runs for an hour.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the SDK (the appserver imports its dist)
        run: pnpm --filter @roomy-space/sdk build
      - name: Run the stack and its integration tests
        run: ./scripts/matrix-bridge-e2e.sh
      - name: Upload the stack's logs and the probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-bridge-e2e
          path: |
            /tmp/matrix-bridge-e2e.log
            /tmp/matrix-bridge-capabilities.json
            /tmp/matrix-bridge-appserver.log
