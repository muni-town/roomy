packages:
  - packages/app-lite
  - packages/appserver
  - packages/docs
  - packages/design
  - packages/sdk
  - packages/discord-bridge
  - packages/cli
  - packages/tsconfig

onlyBuiltDependencies:
  - "@swc/core"
  - "@tailwindcss/oxide"
  - cbor-extract
  - core-js
  - esbuild
  - node

patchedDependencies:
  "@discordeno/gateway": patches/@discordeno__gateway.patch
  # A superseded HappyView session's dead refresh token makes
  # `retirePreviousSession` throw out of `registerSession`, surfacing as
  # "OAuthCallbackError: Failed to register session". Skip retiring a previous
  # session that has a recorded PDS — the server already revoked it.
  "@happyview/oauth-client": patches/@happyview__oauth-client.patch
