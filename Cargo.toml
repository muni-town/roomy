[workspace]
resolver = "2"
members = ["crates/*"]
# The Tauri desktop shell is a separate, self-contained Cargo project with its
# own lockfile. It is not part of the bridge workspace and must never be built
# by `cargo build --workspace`.
exclude = ["packages/app-lite/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MPL-2.0"

[workspace.dependencies]
roomy-events = { path = "crates/roomy-events" }
roomy-client = { path = "crates/roomy-client" }
bridge-core = { path = "crates/bridge-core" }
matrix-adapter = { path = "crates/matrix-adapter" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
ulid = "3.0"
base64 = "0.23"
hex = "0.4"
sha2 = "0.11"
bs58 = "0.5"
url = "2.5"

[profile.release]
debug = 1

# The workspace links a large dependency tree (Matrix crypto, ruma, reqwest +
# rustls). Debug info for it is several gigabytes and buys little for a service
# debugged through its logs, its admin API and its tests.
[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
debug = false
